services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API — MetaMarket NestJS (LangGraph / Conversation OS)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: metamarket-backend
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: metamarket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: metamarket-redis
          property: connectionString
      - key: WEB_CLIENT_ORIGINS
        value: https://metamarket-frontend.onrender.com,http://localhost:3000
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Web Client — Next.js
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: metamarket-frontend
    runtime: node
    plan: 0.5c-512mb
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://metamarket-backend-oan7.onrender.com

  # ─────────────────────────────────────────────────────────────────────────────
  # Managed Key-Value Store / Redis (BullMQ queues, locking, SSE streaming)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: keyvalue
    name: metamarket-redis
    plan: 256mb
    ipAllowList: []

databases:
  # ─────────────────────────────────────────────────────────────────────────────
  # Managed PostgreSQL (pg16 + pgvector)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: metamarket-db
    databaseName: metamarket
    user: metamarket
    plan: 0.5c-1g
